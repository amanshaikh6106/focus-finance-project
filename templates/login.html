{% extends "base.html" %}
{% block title %}Login - FocusFinance{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">Focus<span>Finance</span></div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Log in to continue managing your loans</p>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
    </div>

    
</div>
{% endblock %}
