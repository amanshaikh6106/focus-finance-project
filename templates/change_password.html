{% extends "base.html" %}
{% block title %}Change Password - FocusFinance{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Change Password</h1>
    <p>Update your account password below.</p>
</section>

<section class="form-section">
    <div class="form-card" style="max-width: 480px; margin: 0 auto;">
        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" placeholder="Enter your current password" required>
            </div>
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter a new password (min 6 characters)" minlength="6" required>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Update Password</button>
        </form>
    </div>
</section>
{% endblock %}
